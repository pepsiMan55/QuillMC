plugins {
    id 'java'
}

group = 'net.sopepsi'

// Define separate versions
ext {
    apiVersion = '0.0.2'
    serverVersion = '1.2.6-3'
}

// Use the server version as default for the project
version = serverVersion

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') {
    archiveBaseName = 'quill'
    archiveVersion = serverVersion  // Explicitly set server version
    manifest {
        attributes 'Main-Class': 'net.minecraft.server.QuillMinecraftServer'
    }
    from sourceSets.main.output
}

tasks.register('apiJar', Jar) {
    archiveBaseName = 'quill-api'
    archiveVersion = apiVersion  // Use API version
    archiveClassifier = ''
    from(sourceSets.main.output) {
        include 'net/sopepsi/api/**'
    }
}

test {
    useJUnitPlatform()
}

tasks.register('quillInit', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.sopepsi.tools.QuillInit'
    args = ['init', findProperty('pluginName') ?: 'MyPlugin',
            findProperty('pluginPackage') ?: 'com.example.myplugin',
            findProperty('pluginAuthor') ?: 'Developer']
    workingDir = file(findProperty('initDir') ?: rootProject.projectDir)
}